document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n<\u002Fstyle>\n<style>\n/* ---------- Design tokens ---------- */\n:root {\n  --bg:        #ecedea;          /* cool pearl-grey paper */\n  --bg-2:      #dfe1dc;          /* deeper paper */\n  --surface:   #f5f5f2;          /* warm-white surface */\n  --surface-2: #ffffff;          /* pure white card */\n  --ink:       #0e0e10;          /* near-black, slight cool tilt */\n  --ink-2:     #26262a;\n  --muted:     #6c6c72;\n  --muted-2:   #94949a;\n  --line:      rgba(14, 14, 16, 0.10);\n  --line-2:    rgba(14, 14, 16, 0.18);\n  --accent:    oklch(0.55 0.21 262);     /* electric cobalt */\n  --accent-2:  oklch(0.78 0.14 262);     /* lighter cobalt for fills */\n  --accent-ink:#ffffff;                   /* white text — only safe on the full-saturated --accent fill, not on tints */\n  --on-accent-tint: var(--accent);        /* dark cobalt text — for light tinted backgrounds */\n  --accent-soft: color-mix(in oklch, var(--accent) 14%, var(--surface));\n  --warn:      oklch(0.60 0.18 28);       /* warm signal — \"missed\" */\n\n  /* Type system: Sora display, Nunito body, Geist Mono numerals */\n  --display: \"Sora\", \"Helvetica Neue\", system-ui, sans-serif;\n  --sans:    \"Nunito\", \"Helvetica Neue\", Helvetica, system-ui, sans-serif;\n  --mono:    \"Geist Mono\", \"JetBrains Mono\", ui-monospace, monospace;\n  /* legacy alias so existing rules keep working */\n  --serif:   var(--display);\n\n  --radius-sm: 8px;\n  --radius:    14px;\n  --radius-lg: 22px;\n\n  --shadow-sm: 0 1px 0 rgba(19,18,16,0.04), 0 2px 8px rgba(19,18,16,0.04);\n  --shadow:    0 1px 0 rgba(19,18,16,0.06), 0 10px 30px rgba(19,18,16,0.06);\n  --shadow-lg: 0 1px 0 rgba(19,18,16,0.06), 0 30px 60px -20px rgba(19,18,16,0.18);\n}\n\n* { box-sizing: border-box; }\nhtml, body { margin: 0; padding: 0; }\nhtml { background: var(--bg); scroll-padding-top: 80px; }\nbody { overflow-x: clip; }\nbody {\n  font-family: var(--sans);\n  color: var(--ink);\n  background: var(--bg);\n  font-feature-settings: \"tnum\";\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  line-height: 1.55;\n}\n\na { color: inherit; text-decoration: none; }\nbutton { font: inherit; color: inherit; }\n\n/* ---------- Layout ---------- */\n.container {\n  width: 100%;\n  max-width: 1280px;\n  margin: 0 auto;\n  padding: 0 32px;\n}\nsection { padding: 96px 0; position: relative; }\nsection + section { border-top: 1px solid var(--line); }\n\n.eyebrow {\n  font-family: var(--mono);\n  font-size: 11px;\n  text-transform: uppercase;\n  letter-spacing: 0.14em;\n  color: var(--muted);\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n}\n.eyebrow::before {\n  content: \"\";\n  width: 6px; height: 6px; border-radius: 50%;\n  background: var(--accent);\n  box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent) 25%, transparent);\n}\n\nh1, h2, h3, h4 {\n  font-family: var(--display);\n  font-weight: 700;\n  letter-spacing: -0.025em;\n  line-height: 1.02;\n  margin: 0;\n}\nh1 { font-size: clamp(56px, 8vw, 132px); font-weight: 700; letter-spacing: -0.035em; line-height: 0.98; }\nh2 { font-size: clamp(44px, 6vw, 88px);  font-weight: 700; letter-spacing: -0.03em;  line-height: 1.0; }\nh3 { font-size: clamp(28px, 3vw, 40px);  font-weight: 600; }\nh4 { font-size: 22px; font-weight: 600; letter-spacing: -0.015em; }\n\n/* \"italic\" accent treatment — lighter weight + accent color, no actual italic */\n.italic {\n  font-style: normal;\n  font-weight: 400;\n  color: var(--accent);\n}\nem { font-style: normal; font-weight: 600; color: var(--accent); }\n\np { margin: 0; color: var(--ink-2); }\n.lede { font-size: 19px; line-height: 1.5; color: var(--ink-2); max-width: 56ch; }\n.muted { color: var(--muted); }\n.mono { font-family: var(--mono); }\n.tnum { font-variant-numeric: tabular-nums; }\n\n/* ---------- Top bar ---------- */\n.topbar {\n  position: sticky;\n  top: 0;\n  z-index: 50;\n  background: color-mix(in srgb, var(--bg) 80%, transparent);\n  -webkit-backdrop-filter: saturate(140%) blur(10px);\n  backdrop-filter: saturate(140%) blur(10px);\n  border-bottom: 1px solid var(--line);\n  /* Promote to its own layer — fixes iOS Safari sticky repaint that\n     shoves flex-centered content to the top edge during scroll */\n  -webkit-transform: translateZ(0);\n  transform: translateZ(0);\n  will-change: transform;\n}\n.topbar-inner {\n  min-height: 64px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n}\n.brand {\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  font-family: var(--display);\n  font-weight: 700;\n  font-size: 20px;\n  letter-spacing: -0.025em;\n  white-space: nowrap;\n}\n.brand .ai { color: var(--accent); font-weight: 400; }\n.brand-logo {\n  display: block;\n  width: auto;\n  height: 46px;          /* desktop topbar height */\n  max-width: 100%;\n  object-fit: contain;\n}\n.footer .brand-logo { height: 46px; }\n.brand-dot {\n  width: 12px; height: 12px; border-radius: 50%;\n  background: var(--accent);\n  box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 30%, transparent),\n              inset 0 -2px 4px rgba(0,0,0,0.10);\n}\n.brand small {\n  font-family: var(--mono);\n  font-weight: 400;\n  font-size: 10px;\n  color: var(--muted);\n  text-transform: uppercase;\n  letter-spacing: 0.16em;\n  margin-left: 4px;\n  transform: translateY(1px);\n}\n.nav {\n  display: flex;\n  gap: 28px;\n  font-size: 14px;\n  color: var(--ink-2);\n}\n.nav a:hover { color: var(--ink); }\n.nav-cta {\n  display: flex; gap: 10px; align-items: center;\n}\n\n/* ---------- Buttons ---------- */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  padding: 12px 18px;\n  border-radius: 999px;\n  border: 1px solid var(--line-2);\n  background: var(--surface-2);\n  color: var(--ink);\n  font-size: 14px;\n  font-weight: 500;\n  cursor: pointer;\n  transition: transform .12s ease, background .15s ease, border-color .15s ease;\n}\n.btn:hover { transform: translateY(-1px); border-color: var(--ink-2); }\n.btn svg { width: 16px; height: 16px; flex-shrink: 0; }\n.btn-ghost {\n  background: #ffffff;\n  color: var(--ink);\n  border: 1px solid var(--line);\n}\n.btn-ghost:hover { background: var(--paper); border-color: var(--ink); }\n.footer-link-icon { display: inline-flex; align-items: center; gap: 8px; }\n.footer-link-icon svg { width: 14px; height: 14px; flex-shrink: 0; opacity: 0.7; }\n.btn-primary {\n  background: var(--ink);\n  color: var(--bg);\n  border-color: transparent;\n}\n.btn-primary:hover { background: #000; }\n.btn-mint {\n  background: var(--accent);\n  border-color: transparent;\n  color: var(--accent-ink);\n}\n.btn .arr { display: inline-block; transition: transform .15s ease; }\n.btn:hover .arr { transform: translateX(3px); }\n\n/* ---------- Hero ---------- */\n.hero {\n  padding-top: 56px;\n  padding-bottom: 64px;\n  background: var(--surface-2);\n}\n.hero-grid {\n  display: grid;\n  grid-template-columns: 1.1fr 1fr;\n  gap: 64px;\n  align-items: center;\n}\n\n/* Voice orb — embedded Retell iframe, no chrome */\n.voice-orb {\n  width: 100%;\n  max-width: 520px;\n  aspect-ratio: 1 / 1;\n  margin-left: auto;\n}\n.voice-orb iframe {\n  width: 100%;\n  height: 100%;\n  border: 0;\n  display: block;\n  background: transparent;\n  /* darken blend: white iframe plate matches white hero bg; orb colors pass through. */\n  mix-blend-mode: darken;\n}\n.hero h1 .stack { display: block; }\n.hero h1 .stroke {\n  font-style: normal;\n  font-weight: 700;\n  color: var(--accent);\n}\n.hero-lede { margin-top: 28px; }\n.hero-cta { margin-top: 32px; display: flex; gap: 12px; flex-wrap: wrap; }\n\n.hero-meta {\n  margin-top: 44px;\n  display: grid;\n  grid-template-columns: repeat(3, auto);\n  gap: 32px;\n  padding-top: 20px;\n  max-width: 560px;\n}\n.hero-meta .k { font-family: var(--display); font-weight: 700; font-size: 36px; line-height: 1; letter-spacing: -0.03em; }\n.hero-meta .v { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-top: 8px; }\n\n/* ---------- The Orb ---------- */\n.orb-wrap {\n  position: relative;\n  width: 100%;\n  aspect-ratio: 1 / 1;\n  max-width: 560px;\n  margin-left: auto;\n  display: grid;\n  place-items: center;\n}\n.orb-grid {\n  position: absolute; inset: 0;\n  background-image:\n    linear-gradient(to right, rgba(19,18,16,0.05) 1px, transparent 1px),\n    linear-gradient(to bottom, rgba(19,18,16,0.05) 1px, transparent 1px);\n  background-size: 32px 32px;\n  mask-image: radial-gradient(circle at center, black 30%, transparent 72%);\n  -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 72%);\n}\n.orb-rings { display: none; }\n\n.orb {\n  position: relative;\n  width: 56%;\n  aspect-ratio: 1 / 1;\n  border-radius: 50%;\n  cursor: pointer;\n  z-index: 2;\n\n  background:\n    radial-gradient(circle at 38% 32%, #ffffff 0%, color-mix(in oklch, var(--accent) 60%, white) 22%, var(--accent) 55%, color-mix(in oklch, var(--accent) 70%, var(--ink)) 95%);\n  box-shadow:\n    inset 0 -16px 36px rgba(0,0,0,0.20),\n    inset 0 8px 24px rgba(255,255,255,0.6),\n    0 30px 80px -10px color-mix(in oklch, var(--accent) 50%, transparent),\n    0 6px 20px rgba(0,0,0,0.10);\n  transition: transform .2s cubic-bezier(.2,.7,.3,1.2);\n  animation: orb-breathe 4.5s ease-in-out infinite;\n}\n.orb::before, .orb::after {\n  content: \"\";\n  position: absolute; inset: -2%;\n  border-radius: 50%;\n  pointer-events: none;\n}\n.orb::before {\n  background:\n    radial-gradient(circle at 50% 60%, transparent 55%, color-mix(in oklch, var(--accent) 30%, transparent) 70%, transparent 80%);\n  mix-blend-mode: screen;\n}\n.orb::after {\n  background: conic-gradient(from 200deg, transparent 0deg, color-mix(in oklch, var(--accent) 60%, white) 80deg, transparent 160deg, transparent 360deg);\n  filter: blur(14px);\n  opacity: .55;\n  animation: orb-spin 12s linear infinite;\n  z-index: -1;\n}\n.orb:hover { transform: scale(1.02); }\n\n/* ---- Striking inline \"Talk to on24seven.ai\" CTA (in hero CTA row) ---- */\n.btn-striking-inline {\n  position: relative;\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  padding: 14px 22px;\n  border-radius: 999px;\n  font-family: var(--display);\n  font-weight: 700;\n  font-size: 15px;\n  letter-spacing: -0.005em;\n  white-space: nowrap;\n  background: var(--accent);\n  color: #ffffff;\n  border: 0;\n  cursor: pointer;\n  text-decoration: none;\n  box-shadow:\n    0 1px 0 rgba(255,255,255,0.18) inset,\n    0 -2px 0 rgba(0,0,0,0.10) inset,\n    0 10px 24px -6px color-mix(in oklch, var(--accent) 60%, transparent),\n    0 4px 10px rgba(0,0,0,0.10);\n  transition: transform .15s ease, box-shadow .2s ease, background .15s ease;\n}\n.btn-striking-inline:hover {\n  transform: translateY(-2px);\n  background: color-mix(in oklch, var(--accent) 88%, black);\n  box-shadow:\n    0 1px 0 rgba(255,255,255,0.22) inset,\n    0 -2px 0 rgba(0,0,0,0.10) inset,\n    0 16px 32px -6px color-mix(in oklch, var(--accent) 70%, transparent),\n    0 6px 14px rgba(0,0,0,0.12);\n}\n.btn-striking-inline .arr { display: inline-block; transition: transform .15s ease; }\n.btn-striking-inline:hover .arr { transform: translateX(3px); }\n\n/* ---- Striking \"Talk to on24seven.AI\" CTA ---- */\n.btn-striking {\n  position: absolute;\n  left: 50%;\n  bottom: 4%;\n  transform: translateX(-50%);\n  z-index: 4;\n\n  display: inline-flex;\n  align-items: center;\n  gap: 12px;\n\n  padding: 16px 26px;\n  border-radius: 999px;\n  border: 0;\n\n  font-family: var(--sans);\n  font-weight: 600;\n  font-size: 16px;\n  letter-spacing: -0.005em;\n\n  background: var(--accent);\n  color: #ffffff;\n  text-decoration: none;\n\n  box-shadow:\n    0 10px 30px -8px color-mix(in oklch, var(--accent) 80%, transparent),\n    0 2px 0 rgba(0,0,0,0.10) inset,\n    0 0 0 0 color-mix(in oklch, var(--accent) 60%, transparent);\n\n  cursor: pointer;\n  transition: transform .15s cubic-bezier(.2,.7,.3,1.2),\n              box-shadow .2s ease;\n  animation: striking-pulse 2.4s ease-in-out infinite;\n}\n.btn-striking:hover {\n  transform: translateX(-50%) translateY(-2px);\n  box-shadow:\n    0 16px 40px -8px color-mix(in oklch, var(--accent) 85%, transparent),\n    0 2px 0 rgba(0,0,0,0.10) inset,\n    0 0 0 6px color-mix(in oklch, var(--accent) 25%, transparent);\n}\n.btn-striking .arr { transition: transform .15s ease; display: inline-block; }\n.btn-striking:hover .arr { transform: translateX(3px); }\n.btn-striking .btn-striking-dot {\n  width: 8px; height: 8px; border-radius: 50%;\n  background: #ffffff;\n  box-shadow: 0 0 0 4px rgba(255,255,255,0.25);\n  animation: blink 1.4s ease-in-out infinite;\n}\n@keyframes striking-pulse {\n  0%, 100% {\n    box-shadow:\n      0 10px 30px -8px color-mix(in oklch, var(--accent) 80%, transparent),\n      0 2px 0 rgba(0,0,0,0.10) inset,\n      0 0 0 0 color-mix(in oklch, var(--accent) 50%, transparent);\n  }\n  50% {\n    box-shadow:\n      0 10px 30px -8px color-mix(in oklch, var(--accent) 80%, transparent),\n      0 2px 0 rgba(0,0,0,0.10) inset,\n      0 0 0 10px color-mix(in oklch, var(--accent) 0%, transparent);\n  }\n}\n\n/* keep the HUD readable now that the CTA is sitting on top */\n.orb-hud { bottom: -28px; }\n\n/* ---- Retell iframe orb wrapper ---- */\n.orb-frame-wrap {\n  position: relative;\n  width: 82%;\n  aspect-ratio: 1 / 1;\n  z-index: 2;\n  /* closest-side keeps 100% of the gradient at the nearest iframe edge —\n     so the white plate sides are fully past the transparent endpoint. */\n  -webkit-mask-image: radial-gradient(circle closest-side, #000 18%, rgba(0,0,0,0.5) 38%, transparent 70%);\n          mask-image: radial-gradient(circle closest-side, #000 18%, rgba(0,0,0,0.5) 38%, transparent 70%);\n}\n/* Bold white halo behind the orb — disabled per design feedback. */\n.orb-frame-wrap::before {\n  content: none;\n}\n.orb-frame {\n  width: 100%;\n  height: 100%;\n  border: 0;\n  background: transparent;\n  display: block;\n  position: relative;\n  z-index: 1;\n}\n\n/* mini calendar in demo */\n.mini-cal {\n  display: grid;\n  grid-template-columns: repeat(5, 1fr);\n  gap: 6px;\n  font-family: var(--mono);\n  font-size: 11px;\n}\n.mini-cal .day {\n  border: 1px solid var(--line);\n  border-radius: 8px;\n  padding: 8px 6px;\n  background: var(--surface-2);\n  min-height: 64px;\n  display: flex;\n  flex-direction: column;\n  gap: 4px;\n  position: relative;\n}\n.mini-cal .day .lbl { color: var(--muted); letter-spacing: 0.08em; }\n.mini-cal .day .num { font-family: var(--serif); font-size: 18px; color: var(--ink); }\n.mini-cal .day.has::after {\n  content: \"\";\n  position: absolute; left: 6px; right: 6px; bottom: 6px;\n  height: 4px; border-radius: 999px;\n  background: var(--bg-2);\n}\n.mini-cal .day.booked::after {\n  background: var(--accent);\n  box-shadow: 0 0 0 2px color-mix(in oklch, var(--accent) 25%, transparent);\n  animation: pulse-booking 1.2s ease-out;\n}\n@keyframes pulse-booking {\n  0% { transform: scaleX(0.2); opacity: 0; }\n  100% { transform: scaleX(1); opacity: 1; }\n}\n\n@keyframes orb-breathe {\n  0%, 100% { transform: scale(1); }\n  50% { transform: scale(1.035); }\n}\n@keyframes orb-spin {\n  to { transform: rotate(360deg); }\n}\n\n/* speaking state — adds ripples */\n.orb-wrap[data-state=\"listening\"] .orb { animation: orb-listen 1.3s ease-in-out infinite; }\n.orb-wrap[data-state=\"speaking\"]  .orb { animation: orb-speak 0.55s ease-in-out infinite; }\n\n@keyframes orb-listen {\n  0%, 100% { transform: scale(1); }\n  50% { transform: scale(1.06); }\n}\n@keyframes orb-speak {\n  0%, 100% { transform: scale(1.02); }\n  25% { transform: scale(1.06); }\n  50% { transform: scale(1.01); }\n  75% { transform: scale(1.05); }\n}\n\n.orb-ripple {\n  position: absolute;\n  border-radius: 50%;\n  border: 1px solid color-mix(in oklch, var(--accent) 80%, transparent);\n  pointer-events: none;\n  opacity: 0;\n  z-index: 1;\n}\n.orb-wrap[data-state=\"listening\"] .orb-ripple,\n.orb-wrap[data-state=\"speaking\"] .orb-ripple {\n  animation: ripple 2.2s ease-out infinite;\n}\n.orb-ripple:nth-of-type(2) { animation-delay: 0.55s !important; }\n.orb-ripple:nth-of-type(3) { animation-delay: 1.10s !important; }\n@keyframes ripple {\n  0%   { width: 56%; height: 56%; opacity: 0.5; }\n  100% { width: 110%; height: 110%; opacity: 0; }\n}\n\n/* HUD on the orb panel */\n.orb-hud {\n  position: absolute;\n  inset: auto 0 0 0;\n  display: flex; align-items: center; justify-content: space-between;\n  font-family: var(--mono);\n  font-size: 10.5px;\n  letter-spacing: 0.14em;\n  color: var(--muted);\n  text-transform: uppercase;\n  padding: 0 6px;\n}\n.orb-hud .live { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); }\n.orb-hud .live::before {\n  content: \"\"; width: 6px; height: 6px; border-radius: 50%;\n  background: var(--accent);\n  box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent) 25%, transparent);\n  animation: blink 1.6s ease-in-out infinite;\n}\n@keyframes blink { 50% { opacity: .35; } }\n\n.orb-label {\n  position: absolute;\n  top: 8%; left: 0; right: 0;\n  text-align: center;\n  font-family: var(--mono);\n  font-size: 11px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--ink);\n}\n.orb-label small { display: block; color: var(--muted); margin-top: 4px; font-size: 10px; letter-spacing: 0.14em; }\n\n.orb-cta {\n  position: absolute;\n  bottom: -8px;\n  left: 50%;\n  transform: translateX(-50%);\n  z-index: 3;\n}\n.orb-prompt {\n  position: absolute;\n  top: 18%;\n  left: 0; right: 0;\n  text-align: center;\n  font-family: var(--serif);\n  font-size: 22px;\n  color: var(--ink);\n  font-style: italic;\n  opacity: 0;\n  transition: opacity .3s ease;\n}\n.orb-wrap[data-state=\"listening\"] .orb-prompt,\n.orb-wrap[data-state=\"speaking\"] .orb-prompt { opacity: 1; }\n\n/* ---------- Marquee strip under hero ---------- */\n.strip {\n  border-top: 1px solid var(--line);\n  border-bottom: 1px solid var(--line);\n  padding: 18px 0;\n  overflow: hidden;\n  background: var(--surface);\n}\n.strip-head {\n  padding-bottom: 14px;\n  margin-bottom: 14px;\n  border-bottom: 1px dashed var(--line);\n}\n.strip-eyebrow {\n  font-family: var(--mono);\n  font-size: 11px;\n  text-transform: uppercase;\n  letter-spacing: 0.14em;\n  color: var(--ink);\n  display: inline-flex; align-items: center; gap: 10px;\n}\n.strip-eyebrow::before {\n  content: \"\";\n  width: 6px; height: 6px; border-radius: 50%;\n  background: var(--accent);\n  box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent) 25%, transparent);\n}\n.strip-eyebrow-soft { color: var(--muted); }\n\n.strip-track {\n  display: flex; gap: 56px;\n  white-space: nowrap;\n  animation: marquee 60s linear infinite;\n  will-change: transform;\n  backface-visibility: hidden;\n  font-family: var(--display);\n  font-weight: 600;\n  font-size: 18px;\n  letter-spacing: -0.01em;\n  color: var(--ink);\n}\n.strip-track span { display: inline-flex; align-items: center; gap: 18px; flex-shrink: 0; }\n.strip-track span::after {\n  content: \"\";\n  width: 6px; height: 6px; border-radius: 50%;\n  background: var(--accent);\n  opacity: 0.6;\n}\n.strip-track span:last-child::after { display: none; }\n@keyframes marquee {\n  from { transform: translateX(var(--marquee-start, 0px)); }\n  to   { transform: translateX(calc(var(--marquee-start, 0px) - 50%)); }\n}\n\n/* ---------- Sec headers ---------- */\n.sec-head { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 20px; margin-bottom: 48px; }\n.sec-head .sec-title { max-width: 28ch; font-size: clamp(36px, 4.5vw, 60px); }\n.sec-head .sec-title .italic { display: block; }\n.sec-head .sec-aside { max-width: 60ch; color: var(--ink-2); font-size: 16px; font-weight: 500; line-height: 1.55; }\n\n/* ---------- Demo player ---------- */\n.demo {\n  background: var(--surface);\n  border-radius: var(--radius-lg);\n  border: 1px solid var(--line);\n  overflow: hidden;\n  display: grid;\n  grid-template-columns: 1fr 1.2fr;\n  box-shadow: var(--shadow);\n}\n.demo-side {\n  padding: 28px;\n  border-right: 1px solid var(--line);\n  background:\n    radial-gradient(circle at 90% 0%, color-mix(in oklch, var(--accent) 25%, transparent) 0%, transparent 60%),\n    var(--surface);\n  display: flex; flex-direction: column;\n}\n.caller {\n  display: flex; align-items: center; gap: 14px;\n}\n.caller-av {\n  width: 44px; height: 44px; border-radius: 50%;\n  background: var(--ink); color: var(--bg);\n  display: grid; place-items: center;\n  font-family: var(--mono); font-size: 14px;\n}\n.caller-name { font-family: var(--display); font-weight: 600; font-size: 22px; letter-spacing: -0.02em; }\n.caller-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }\n\n.demo-controls {\n  margin-top: auto;\n  display: flex; gap: 10px; align-items: center;\n  padding-top: 24px;\n  border-top: 1px dashed var(--line-2);\n}\n.play-btn {\n  width: 56px; height: 56px; border-radius: 50%;\n  background: var(--ink); color: var(--bg);\n  border: none; cursor: pointer;\n  display: grid; place-items: center;\n  transition: transform .15s ease;\n}\n.play-btn:hover { transform: scale(1.05); }\n.play-btn svg { display: block; }\n.demo-progress { flex: 1; }\n.demo-progress .bar {\n  position: relative;\n  height: 4px; border-radius: 999px;\n  background: var(--line);\n  overflow: hidden;\n}\n.demo-progress .bar-fill {\n  position: absolute; left: 0; top: 0; height: 100%;\n  width: 0%;\n  background: var(--ink);\n  transition: width .1s linear;\n}\n.demo-progress .meta {\n  display: flex; justify-content: space-between;\n  font-family: var(--mono); font-size: 11px;\n  color: var(--muted);\n  margin-top: 8px;\n}\n\n.demo-stage {\n  padding: 28px 32px;\n  max-height: 540px;\n  overflow-y: auto;\n  scroll-behavior: smooth;\n}\n.bubble {\n  margin: 14px 0;\n  max-width: 88%;\n  font-size: 15.5px;\n  line-height: 1.5;\n  opacity: 0;\n  transform: translateY(8px);\n  transition: opacity .35s ease, transform .35s ease;\n}\n.bubble.in { opacity: 1; transform: none; }\n.bubble.ai { padding: 16px 18px; background: var(--bg-2); border-radius: 16px 16px 16px 4px; }\n.bubble.user { padding: 16px 18px; background: var(--ink); color: var(--bg); border-radius: 16px 16px 4px 16px; margin-left: auto; }\n.bubble .who {\n  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;\n  margin-bottom: 6px;\n}\n.bubble.ai .who { color: var(--muted); }\n.bubble.user .who { color: var(--muted-2); }\n\n.calendar-flash {\n  display: none;\n  margin: 14px 0 0 0;\n  padding: 14px 16px;\n  border: 1px solid var(--accent);\n  background: color-mix(in oklch, var(--accent) 18%, var(--surface-2));\n  border-radius: 12px;\n  font-family: var(--mono); font-size: 12px; color: var(--on-accent-tint);\n  letter-spacing: 0.05em;\n  align-items: center; gap: 10px;\n  animation: flash-in .4s ease both;\n}\n.calendar-flash.show { display: flex; }\n@keyframes flash-in {\n  from { opacity: 0; transform: translateY(6px); }\n  to   { opacity: 1; transform: none; }\n}\n\n/* ---------- Value props — single column, icon-left rows ---------- */\n.vp-grid {\n  display: flex;\n  flex-direction: column;\n  border: 1px solid var(--line);\n  border-radius: var(--radius-lg);\n  overflow: hidden;\n  background: var(--surface);\n  max-width: 900px;\n  margin: 0 auto;\n}\n.vp {\n  display: grid;\n  grid-template-columns: 56px 1fr auto;\n  column-gap: 20px;\n  align-items: start;\n  padding: 24px 28px;\n  border-bottom: 1px solid var(--line);\n  background: var(--surface);\n  position: relative;\n}\n.vp:last-child { border-bottom: 0; }\n\n.vp .ic {\n  grid-row: 1 / span 2;\n  grid-column: 1;\n  align-self: start;\n  width: 48px; height: 48px; border-radius: 12px;\n  border: 1px solid var(--line);\n  display: grid; place-items: center;\n  background: #ffffff;\n  color: var(--ink);\n  margin: 0;\n}\n.vp .ic svg { width: 22px; height: 22px; stroke-width: 1.5; }\n.ind-icon svg { width: 24px; height: 24px; stroke-width: 1.5; }\n\n.vp h4 {\n  grid-column: 2;\n  grid-row: 1;\n  font-family: var(--display);\n  font-weight: 700;\n  font-size: 22px;\n  letter-spacing: -0.02em;\n  line-height: 1.2;\n  margin: 0;\n  align-self: center;\n}\n.vp p {\n  grid-column: 2;\n  grid-row: 2;\n  font-size: 14.5px;\n  color: var(--muted);\n  line-height: 1.55;\n  margin: 6px 0 0;\n  max-width: 64ch;\n}\n.vp .num {\n  grid-column: 3;\n  grid-row: 1 / span 2;\n  align-self: start;\n  font-family: var(--display);\n  font-weight: 700;\n  font-size: 28px;\n  color: var(--ink);\n  letter-spacing: -0.02em;\n  line-height: 1;\n  margin: 0;\n}\n\n/* ---- Flagship row keeps the dark treatment ---- */\n.vp-feature {\n  background: var(--ink);\n  color: var(--bg);\n  display: grid;\n  grid-template-columns: 56px 1fr auto;\n  column-gap: 20px;\n  padding: 28px;\n}\n.vp-feature > div:first-child { display: contents; }\n.vp-feature > div:last-child {\n  grid-column: 2 / -1;\n  margin-top: 18px;\n}\n.vp-feature .ic {\n  background: rgba(255,255,255,0.10);\n  color: var(--bg);\n  align-self: start;\n}\n.vp-feature h4 {\n  color: var(--bg);\n  font-size: 24px;\n  letter-spacing: -0.02em;\n  font-weight: 700;\n  margin: 0;\n  align-self: center;\n  grid-row: 1;\n  grid-column: 2;\n}\n.vp-feature .italic { color: var(--accent-2); }\n.vp-feature p {\n  color: rgba(236,237,234,0.7);\n  font-size: 14.5px;\n  max-width: 64ch;\n  grid-row: 2;\n  grid-column: 2;\n  margin: 6px 0 0;\n}\n.vp-feature .num {\n  grid-column: 3;\n  grid-row: 1 / span 2;\n  align-self: start;\n  font-family: var(--display);\n  font-weight: 700;\n  font-size: 22px;\n  color: rgba(236,237,234,0.8);\n  letter-spacing: -0.02em;\n  line-height: 1;\n  margin: 0;\n}\n.vp-feature .stat-line {\n  display: flex; gap: 28px; flex-wrap: wrap;\n  font-family: var(--mono); font-size: 11px;\n  color: rgba(236,237,234,0.5);\n  text-transform: uppercase; letter-spacing: 0.14em;\n}\n.vp-feature .stat-line strong {\n  display: block; font-family: var(--display); font-weight: 700; font-size: 28px;\n  color: var(--bg); margin-bottom: 4px; letter-spacing: -0.025em;\n}\n\n/* ---------- Compare ---------- */\n.compare {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 24px;\n}\n.compare-col {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: var(--radius-lg);\n  padding: 28px;\n  position: relative;\n}\n.col-status {\n  position: absolute;\n  top: 20px; right: 20px;\n  width: 44px; height: 44px;\n  border-radius: 50%;\n  display: grid;\n  place-items: center;\n  z-index: 2;\n  flex-shrink: 0;\n}\n.col-status svg {\n  width: 12px !important; height: 12px !important;\n  stroke-width: 4;\n}\n.col-status-bad {\n  background: oklch(0.60 0.18 28);\n  color: #ffffff;\n  box-shadow: 0 0 0 4px color-mix(in oklch, oklch(0.60 0.18 28) 22%, transparent);\n}\n.col-status-good {\n  background: oklch(0.62 0.15 152);\n  color: #ffffff;\n  box-shadow: 0 0 0 4px color-mix(in oklch, oklch(0.62 0.15 152) 22%, transparent);\n}\n.compare-col.bad {\n  background: color-mix(in oklch, var(--warn) 5%, var(--surface));\n  border-color: color-mix(in oklch, var(--warn) 25%, var(--line));\n}\n.compare-col.good {\n  background: color-mix(in oklch, var(--accent) 8%, var(--surface));\n  border-color: color-mix(in oklch, var(--accent) 30%, var(--line));\n}\n.compare-col h4 {\n  font-family: var(--display);\n  font-weight: 700;\n  font-size: 38px;\n  letter-spacing: -0.03em;\n  margin-bottom: 6px;\n  line-height: 1.05;\n}\n.compare-col .col-sub {\n  font-family: var(--mono); font-size: 11px;\n  color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase;\n  margin-bottom: 24px;\n}\n.call-list { list-style: none; padding: 0; margin: 0; }\n.call-list li {\n  display: grid;\n  grid-template-columns: 78px 1fr auto;\n  gap: 14px;\n  align-items: center;\n  padding: 12px 0;\n  border-bottom: 1px dashed var(--line);\n  font-size: 14.5px;\n}\n.call-list li:last-child { border-bottom: 0; }\n.call-list .t { font-family: var(--mono); font-size: 12px; color: var(--muted); }\n.call-list .desc { color: var(--ink-2); }\n.call-list .tag {\n  font-family: var(--mono); font-size: 10.5px;\n  padding: 4px 10px;\n  border-radius: 999px;\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n}\n.tag.miss   { background: color-mix(in oklch, var(--warn) 18%, transparent); color: var(--warn); }\n.tag.vm     { background: var(--bg-2); color: var(--muted); }\n.tag.book   { background: var(--ink); color: var(--bg); }\n.tag.handled{ background: var(--accent); color: var(--accent-ink); }\n.tag.ans    { background: color-mix(in oklch, var(--accent) 22%, var(--surface)); color: var(--on-accent-tint); }\n\n.compare-foot {\n  margin-top: 24px;\n  display: grid;\n  grid-template-columns: auto auto 1fr;\n  gap: 12px 28px;\n  padding-top: 20px;\n  border-top: 1px solid var(--line);\n  align-items: start;\n}\n.compare-foot > div { min-width: 0; }\n.compare-foot .k { font-family: var(--display); font-weight: 700; font-size: 44px; letter-spacing: -0.035em; line-height: 1; white-space: nowrap; }\n.compare-foot > div:last-child .k { font-size: 38px; text-align: right; }\n.compare-foot > div:last-child { text-align: right; justify-self: end; }\n.compare-foot .v { font-family: var(--mono); font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.12em; margin-top: 8px; white-space: nowrap; }\n.compare-col.bad .compare-foot .k.lost { color: var(--warn); }\n.compare-col.good .compare-foot .k.gain { color: var(--accent); }\n\n/* ---------- ROI ---------- */\n.roi {\n  display: grid;\n  grid-template-columns: 1.1fr 1fr;\n  gap: 32px;\n  background: var(--surface);\n  border-radius: var(--radius-lg);\n  border: 1px solid var(--line);\n  padding: 36px;\n}\n.sliders { display: flex; flex-direction: column; gap: 28px; }\n.slider-row label {\n  display: flex; justify-content: space-between; align-items: baseline;\n  font-family: var(--mono); font-size: 11.5px; color: var(--muted);\n  letter-spacing: 0.1em; text-transform: uppercase;\n  margin-bottom: 12px;\n}\n.slider-row label .val {\n  font-family: var(--display); font-weight: 700; font-size: 28px; color: var(--ink);\n  letter-spacing: -0.025em; text-transform: none;\n}\n.slider-row input[type=\"range\"] {\n  -webkit-appearance: none; appearance: none;\n  width: 100%; height: 4px; border-radius: 999px;\n  background: linear-gradient(to right, var(--ink) var(--p, 50%), var(--line) var(--p, 50%));\n  outline: none;\n}\n.slider-row input[type=\"range\"]::-webkit-slider-thumb {\n  -webkit-appearance: none;\n  width: 18px; height: 18px; border-radius: 50%;\n  background: var(--bg);\n  border: 2px solid var(--ink);\n  cursor: pointer;\n  box-shadow: var(--shadow-sm);\n  transition: transform .12s ease;\n}\n.slider-row input[type=\"range\"]::-webkit-slider-thumb:hover { transform: scale(1.1); }\n.slider-row input[type=\"range\"]::-moz-range-thumb {\n  width: 18px; height: 18px; border-radius: 50%;\n  background: var(--bg); border: 2px solid var(--ink); cursor: pointer;\n}\n.slider-row .help { font-size: 12.5px; color: var(--muted); margin-top: 8px; }\n\n.roi-result {\n  background: var(--ink);\n  color: var(--bg);\n  border-radius: var(--radius-lg);\n  padding: 32px;\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n  position: relative;\n  overflow: hidden;\n}\n.roi-result::before {\n  content: \"\";\n  position: absolute; right: -40px; top: -40px;\n  width: 200px; height: 200px;\n  background: radial-gradient(circle, color-mix(in oklch, var(--accent) 50%, transparent), transparent 70%);\n  filter: blur(20px);\n  pointer-events: none;\n}\n.roi-result .roi-eyebrow {\n  font-family: var(--mono); font-size: 11px;\n  color: rgba(236,237,234,0.55); letter-spacing: 0.14em; text-transform: uppercase;\n}\n.roi-result .big {\n  font-family: var(--display); font-weight: 700;\n  font-size: clamp(56px, 7vw, 100px);\n  line-height: 0.98;\n  letter-spacing: -0.035em;\n  color: var(--bg);\n}\n.roi-result .big .currency { color: var(--accent-2); font-weight: 400; }\n.roi-result .breakdown {\n  list-style: none; padding: 0; margin: 0;\n  border-top: 1px solid rgba(236,237,234,0.15);\n  margin-top: auto;\n}\n.roi-result .breakdown li {\n  display: flex; justify-content: space-between;\n  padding: 12px 0;\n  border-bottom: 1px solid rgba(236,237,234,0.10);\n  font-size: 14px;\n  color: rgba(236,237,234,0.7);\n}\n.roi-result .breakdown li.total {\n  color: var(--bg);\n  border-bottom: 0;\n  font-family: var(--display);\n  font-weight: 600;\n  font-size: 26px;\n  padding-top: 16px;\n  letter-spacing: -0.025em;\n}\n.roi-result .breakdown li .v { font-family: var(--mono); font-size: 14px; }\n.roi-result .breakdown li.total .v { font-family: var(--display); font-weight: 700; font-size: 26px; color: var(--accent-2); letter-spacing: -0.025em; }\n\n/* ---------- Industries ---------- */\n.industries {\n  display: grid;\n  grid-template-columns: repeat(2, 1fr);\n  gap: 16px;\n}\n.ind {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: var(--radius-lg);\n  padding: 32px;\n  display: flex;\n  flex-direction: column;\n  gap: 18px;\n  transition: border-color .15s ease, transform .15s ease, background .15s ease;\n  position: relative;\n  overflow: hidden;\n}\n.ind::before {\n  content: \"\";\n  position: absolute;\n  inset: auto -40% -50% auto;\n  width: 240px; height: 240px;\n  border-radius: 50%;\n  background: radial-gradient(circle, color-mix(in oklch, var(--accent) 18%, transparent), transparent 65%);\n  pointer-events: none;\n  opacity: 0;\n  transition: opacity .25s ease;\n}\n.ind:hover { border-color: var(--ink-2); transform: translateY(-2px); }\n.ind:hover::before { opacity: 1; }\n\n.ind-head {\n  display: flex;\n  align-items: flex-start;\n  gap: 16px;\n}\n.ind-icon {\n  width: 48px; height: 48px;\n  border-radius: 14px;\n  background: var(--ink);\n  color: var(--bg);\n  display: grid; place-items: center;\n  flex-shrink: 0;\n}\n.ind-tag {\n  display: inline-block;\n  font-family: var(--mono);\n  font-size: 10.5px;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n.ind h4 {\n  font-family: var(--display); font-weight: 700; font-size: 28px; letter-spacing: -0.025em;\n  margin: 6px 0 0;\n  line-height: 1.1;\n}\n.ind > p {\n  font-size: 14.5px;\n  color: var(--ink-2);\n  line-height: 1.55;\n  max-width: 44ch;\n  margin: 0;\n}\n\n.ind-bullets {\n  list-style: none;\n  padding: 0;\n  margin: auto 0 0;\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n  padding-top: 20px;\n  border-top: 1px dashed var(--line-2);\n}\n.ind-bullets li {\n  display: grid;\n  grid-template-columns: 18px 1fr;\n  gap: 12px;\n  align-items: flex-start;\n  font-size: 14px;\n  line-height: 1.5;\n  color: var(--ink-2);\n}\n.ind-bullets li::before {\n  content: \"\";\n  display: block;\n  width: 8px; height: 8px;\n  margin-top: 8px;\n  background: var(--accent);\n  border-radius: 2px;\n  transform: rotate(45deg);\n  flex-shrink: 0;\n}\n\n/* ---------- Process ---------- */\n.process {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 24px;\n}\n.proc {\n  border: 1px solid var(--line);\n  border-radius: var(--radius-lg);\n  padding: 32px;\n  background: var(--surface);\n  position: relative;\n}\n.proc .step {\n  font-family: var(--mono); font-size: 11px; color: var(--muted);\n  letter-spacing: 0.14em; text-transform: uppercase;\n  display: flex; justify-content: space-between;\n  margin-bottom: 32px;\n}\n.proc .step .day { color: var(--ink); }\n.proc h4 { font-family: var(--display); font-weight: 700; font-size: 32px; margin: 0 0 10px; letter-spacing: -0.03em; }\n.proc p { font-size: 14.5px; color: var(--muted); }\n.proc .ord {\n  font-family: var(--display); font-weight: 300; font-size: 84px; color: var(--bg-2); line-height: 1;\n  position: absolute; right: 24px; top: 24px;\n  pointer-events: none; letter-spacing: -0.03em;\n}\n\n/* ---------- Pricing ---------- */\n.pricing {\n  display: grid;\n  grid-template-columns: 1.1fr 1fr;\n  gap: 24px;\n}\n.price-main {\n  background: var(--ink);\n  color: var(--bg);\n  border-radius: var(--radius-lg);\n  padding: 40px;\n  position: relative;\n  overflow: hidden;\n}\n.price-main::before {\n  content: \"\";\n  position: absolute; bottom: -80px; right: -80px;\n  width: 320px; height: 320px;\n  background: radial-gradient(circle, color-mix(in oklch, var(--accent) 60%, transparent), transparent 70%);\n  filter: blur(30px);\n  pointer-events: none;\n}\n.price-main .badge {\n  display: inline-flex;\n  font-family: var(--mono); font-size: 11px;\n  letter-spacing: 0.14em; text-transform: uppercase;\n  background: rgba(255,255,255,0.10);\n  padding: 6px 12px; border-radius: 999px;\n  color: rgba(236,237,234,0.8);\n}\n.price-main .big {\n  font-family: var(--display);\n  font-weight: 700;\n  font-size: clamp(80px, 10vw, 152px);\n  line-height: 0.95;\n  letter-spacing: -0.045em;\n  margin: 24px 0 0;\n}\n.price-main .big sub { font-family: var(--mono); font-weight: 400; font-size: 18px; color: rgba(236,237,234,0.6); margin-left: 10px; letter-spacing: 0; vertical-align: baseline; }\n.price-main p { color: rgba(236,237,234,0.7); max-width: 38ch; margin: 18px 0 28px; }\n.price-main ul {\n  list-style: none; padding: 0; margin: 0;\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 8px 24px;\n  font-size: 14px;\n  color: rgba(236,237,234,0.8);\n}\n.price-main ul li {\n  padding: 8px 0;\n  border-top: 1px solid rgba(236,237,234,0.1);\n  display: flex; align-items: center; gap: 10px;\n}\n.price-main ul li::before {\n  content: \"\"; width: 4px; height: 4px; border-radius: 50%;\n  background: var(--accent);\n}\n\n.price-aside { display: grid; gap: 16px; }\n.price-card {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: var(--radius-lg);\n  padding: 28px;\n}\n.price-card h5 {\n  font-family: var(--mono); font-size: 11px; color: var(--muted);\n  letter-spacing: 0.14em; text-transform: uppercase; margin: 0 0 14px;\n}\n.price-card .row {\n  display: flex; justify-content: space-between; align-items: baseline;\n  padding: 12px 0;\n  border-bottom: 1px dashed var(--line);\n}\n.price-card .row:last-child { border-bottom: 0; }\n.price-card .row .lab { font-size: 14.5px; }\n.price-card .row .val { font-family: var(--mono); font-size: 13px; color: var(--muted); }\n\n/* ---------- Closing CTA ---------- */\n.cta-final {\n  text-align: center;\n  padding: 120px 0;\n  background:\n    radial-gradient(circle at 50% 80%, color-mix(in oklch, var(--accent) 22%, transparent) 0%, transparent 50%),\n    var(--bg);\n  border-top: 1px solid var(--line);\n}\n.cta-final h2 { font-size: clamp(56px, 8vw, 124px); max-width: 14ch; margin: 0 auto 28px; }\n.cta-final .cta-row { display: inline-flex; gap: 12px; }\n\n/* \"Ready when you are\" pill with pulse dot */\n.ready-pill {\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  padding: 9px 18px 9px 14px;\n  border: 1px solid var(--line);\n  border-radius: 999px;\n  font-family: var(--mono);\n  font-size: 12px;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--ink-2);\n  background: color-mix(in oklch, var(--paper) 60%, transparent);\n}\n.ready-dot {\n  width: 8px;\n  height: 8px;\n  border-radius: 50%;\n  background: var(--accent);\n  box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent) 22%, transparent);\n  animation: ready-pulse 1.8s ease-in-out infinite;\n}\n@keyframes ready-pulse {\n  0%, 100% { opacity: 1; transform: scale(1); }\n  50%      { opacity: 0.55; transform: scale(0.7); }\n}\n@media (prefers-reduced-motion: reduce) {\n  .ready-dot { animation: none; }\n}\n\n/* ---------- Footer ---------- */\n.footer {\n  padding: 56px 0 28px;\n  border-top: 1px solid var(--line);\n  background: var(--surface);\n}\n.footer-grid {\n  display: grid;\n  grid-template-columns: 2fr 1fr 1fr 1fr;\n  gap: 32px;\n  padding-bottom: 40px;\n  border-bottom: 1px dashed var(--line);\n}\n.footer h6 {\n  font-family: var(--mono); font-size: 11px;\n  letter-spacing: 0.14em; text-transform: uppercase;\n  color: var(--muted); margin: 0 0 16px;\n}\n.footer ul { list-style: none; padding: 0; margin: 0; font-size: 14.5px; color: var(--ink-2); display: flex; flex-direction: column; gap: 10px; }\n.footer ul a:hover { color: var(--ink); }\n.footer .blurb { font-family: var(--serif); font-size: 26px; max-width: 28ch; }\n.footer-bottom {\n  padding-top: 20px;\n  display: flex;\n  justify-content: space-between;\n  font-family: var(--mono); font-size: 11px;\n  color: var(--muted); letter-spacing: 0.1em;\n  text-transform: uppercase;\n}\n\n/* ---------- FAQ ---------- */\n.faq-list {\n  max-width: 920px;\n  margin: 0 auto;\n  border-top: 1px solid var(--line);\n}\n.faq-item {\n  border-bottom: 1px solid var(--line);\n}\n.faq-item > summary {\n  list-style: none;\n  cursor: pointer;\n  display: grid;\n  grid-template-columns: 56px 1fr 32px;\n  align-items: center;\n  gap: 20px;\n  padding: 26px 8px;\n  font-family: var(--display);\n  font-weight: 500;\n  font-size: 22px;\n  line-height: 1.3;\n  letter-spacing: -0.015em;\n  color: var(--ink);\n  transition: color 180ms ease;\n}\n.faq-item > summary::-webkit-details-marker { display: none; }\n.faq-item > summary:hover { color: var(--accent); }\n.faq-item > summary:focus-visible {\n  outline: 2px solid var(--accent);\n  outline-offset: 4px;\n  border-radius: 4px;\n}\n.faq-num {\n  font-family: var(--mono);\n  font-size: 12px;\n  letter-spacing: 0.12em;\n  color: var(--muted);\n  text-transform: uppercase;\n}\n.faq-q { padding-right: 12px; }\n.faq-toggle {\n  position: relative;\n  width: 18px; height: 18px;\n  justify-self: end;\n}\n.faq-toggle::before,\n.faq-toggle::after {\n  content: \"\";\n  position: absolute;\n  background: var(--ink);\n  border-radius: 1px;\n  transition: transform ct workflow — services, providers,\n        edge cases, the way your front desk actually talks. Four of the most common deployments\n        we ship, and what each one handles out of the box.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"industries\">\n\n      <article class=\"ind\">\n        <header class=\"ind-head\">\n          <div class=\"ind-icon\" aria-hidden=\"true\"><i data-lucide=\"scale\" stroke-width=\"1.5\"><\u002Fi><\u002Fdiv>\n          <div>\n            <span class=\"ind-tag\">Legal &amp; real estate<\u002Fspan>\n            <h4>Law firms &amp; real estate agencies<\u002Fh4>\n          <\u002Fdiv>\n        <\u002Fheader>\n        <p>Qualifies every new caller with the polish of a front-desk pro — captures the\n          right details, screens for fit, and books consults or showings with the right\n          person on your team.<\u002Fp>\n        <ul class=\"ind-bullets\">\n          <li>New matter &amp; new lead intake — practice area, property, timeline, budget<\u002Fli>\n          <li>Conflict checks for firms, buyer/seller qualifying for agencies<\u002Fli>\n          <li>Routes by specialty — practice area or listing agent / territory<\u002Fli>\n          <li>Knows its limits — never gives legal advice or quotes a price, escalates to a human<\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n\n      <article class=\"ind\">\n        <header class=\"ind-head\">\n          <div class=\"ind-icon\" aria-hidden=\"true\"><i data-lucide=\"stethoscope\" stroke-width=\"1.5\"><\u002Fi><\u002Fdiv>\n          <div>\n            <span class=\"ind-tag\">Med spa &amp; dental<\u002Fspan>\n            <h4>Med spa, dental &amp; clinics<\u002Fh4>\n          <\u002Fdiv>\n        <\u002Fheader>\n        <p>Routes the right call to the right provider — and knows when to stop talking\n          and put a human on the line.<\u002Fp>\n        <ul class=\"ind-bullets\">\n          <li>Provider routing — injectables to the MD, facials to estheticians<\u002Fli>\n          <li>New patient intake — DOB, insurance, primary concern<\u002Fli>\n          <li>Pre-visit prompts (no caffeine, no retinol, arrival window)<\u002Fli>\n          <li>HIPAA-aware transcripts, escalates clinical questions<\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n\n      <article class=\"ind\">\n        <header class=\"ind-head\">\n          <div class=\"ind-icon\" aria-hidden=\"true\"><i data-lucide=\"scissors\" stroke-width=\"1.5\"><\u002Fi><\u002Fdiv>\n          <div>\n            <span class=\"ind-tag\">Salons, barbershops &amp; nail studios<\u002Fspan>\n            <h4>Barbershops, salons &amp; nail studios<\u002Fh4>\n          <\u002Fdiv>\n        <\u002Fheader>\n        <p>Books across multiple chairs, stylists, and technicians — knows who does what,\n          how long each service really takes, and how to upsell the add-ons.<\u002Fp>\n        <ul class=\"ind-bullets\">\n          <li>Provider-specific booking (Mike vs. Sam vs. next available)<\u002Fli>\n          <li>Multi-service combos — cut + beard, gel mani + nail art, etc.<\u002Fli>\n          <li>Walk-in vs. appointment triage + waitlist text-back when a slot opens<\u002Fli>\n          <li>SMS confirmations + 24-hour reminders to cut no-shows<\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n\n      <article class=\"ind\">\n        <header class=\"ind-head\">\n          <div class=\"ind-icon\" aria-hidden=\"true\"><i data-lucide=\"wrench\" stroke-width=\"1.5\"><\u002Fi><\u002Fdiv>\n          <div>\n            <span class=\"ind-tag\">Home &amp; field services<\u002Fspan>\n            <h4>HVAC, electricians &amp; trades<\u002Fh4>\n          <\u002Fdiv>\n        <\u002Fheader>\n        <p>Captures every detail a dispatcher would — address, scope, urgency — and books\n          the right crew with travel time baked in.<\u002Fp>\n        <ul class=\"ind-bullets\">\n          <li>Address + scope capture (sqft, bed/bath count, system type)<\u002Fli>\n          <li>Crew assignment with 30-minute travel buffers<\u002Fli>\n          <li>Emergency vs. routine call triage<\u002Fli>\n          <li>Quote ranges from your pricebook, hands off to ops on close<\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== PROCESS ============== -->\n<section id=\"process\" data-screen-label=\"06 Process\">\n  <div class=\"container\">\n    <div class=\"sec-head\">\n      <div>\n        <span class=\"eyebrow\" style=\"font-family: Nunito; font-weight: 700\">Process<\u002Fspan>\n        <h2 class=\"sec-title\" style=\"margin-top: 20px; font-weight: 400\">\n          Live in under <span class=\"italic\" style=\"font-weight: 500\">two weeks.<\u002Fspan>\n        <\u002Fh2>\n      <\u002Fdiv>\n      <p class=\"sec-aside\">We build a custom agent around your workflow, train it on your\n        services and policies, then forward your number. No templates. No rip-and-replace.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"process\">\n      <article class=\"proc\">\n        <div class=\"step\"><span>Step 01<\u002Fspan><span class=\"day\">Day 1<\u002Fspan><\u002Fdiv>\n        <h4>Discovery call<\u002Fh4>\n        <p>30 minutes. We map your services, your pricing, your edge cases, and exactly\n          how a call should flow when it goes right — and when it doesn't.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"proc\">\n        <div class=\"step\"><span>Step 02<\u002Fspan><span class=\"day\">Days 2 – 10<\u002Fspan><\u002Fdiv>\n        <h4>Custom build &amp; training<\u002Fh4>\n        <p>We build your agent, integrate your calendar, voice it to match your brand, and\n          run hundreds of test calls against the scenarios you handed us.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"proc\">\n        <div class=\"step\"><span>Step 03<\u002Fspan><span class=\"day\">Day 10 – 14<\u002Fspan><\u002Fdiv>\n        <h4>Go live<\u002Fh4>\n        <p>Forward your number. Every call answered, every appointment booked, every\n          conversation logged. You focus on the work.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== FAQ ============== -->\n<section id=\"faq\" data-screen-label=\"07 FAQ\">\n  <div class=\"container\">\n    <div class=\"sec-head\">\n      <div>\n        <span class=\"eyebrow\" style=\"font-family: Nunito; font-weight: 700\">FAQ<\u002Fspan>\n        <h2 class=\"sec-title\" style=\"margin-top: 20px; font-weight: 400\">\n          Real questions. <span class=\"italic\" style=\"font-weight: 500\">Straight answers.<\u002Fspan>\n        <\u002Fh2>\n      <\u002Fdiv>\n      <p class=\"sec-aside\">Everything owners ask on the intro call — answered up front. Still\n        have something we missed? Pick it up on the 15-minute discovery call.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"faq-list\">\n      <details class=\"faq-item\">\n        <summary>\n          <span class=\"faq-num\">01<\u002Fspan>\n          <span class=\"faq-q\">How much does it cost?<\u002Fspan>\n          <span class=\"faq-toggle\" aria-hidden=\"true\"><\u002Fspan>\n        <\u002Fsummary>\n        <div class=\"faq-a\">\n          <p>Every business is different. After a 30-minute discovery call we quote based on\n            call volume, integrations, and languages. Most teams are live in about two weeks,\n            cancel anytime.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details class=\"faq-item\">\n        <summary>\n          <span class=\"faq-num\">02<\u002Fspan>\n          <span class=\"faq-q\">Can I keep my existing phone number?<\u002Fspan>\n          <span class=\"faq-toggle\" aria-hidden=\"true\"><\u002Fspan>\n        <\u002Fsummary>\n        <div class=\"faq-a\">\n          <p>Yes. We either port your number over or set up forwarding from your current\n            line. Your customers dial the same number they always have — nothing changes\n            on their end.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details class=\"faq-item\">\n        <summary>\n          <span class=\"faq-num\">03<\u002Fspan>\n          <span class=\"faq-q\">What does it connect to?<\u002Fspan>\n          <span class=\"faq-toggle\" aria-hidden=\"true\"><\u002Fspan>\n        <\u002Fsummary>\n        <div class=\"faq-a\">\n          <p>We integrate with the tools you're already using — Google, Outlook, Calendly,\n            and Acuity for scheduling; HubSpot, Salesforce, Pipedrive, GoHighLevel, and Zoho\n            for your CRM. We also pull in your FAQs, pricing info, and business policies so\n            the AI answers like someone who actually knows your business.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details class=\"faq-item\">\n        <summary>\n          <span class=\"faq-num\">04<\u002Fspan>\n          <span class=\"faq-q\">How long until I'm live?<\u002Fspan>\n          <span class=\"faq-toggle\" aria-hidden=\"true\"><\u002Fspan>\n        <\u002Fsummary>\n        <div class=\"faq-a\">\n          <p>Most businesses are up and running within two weeks. We handle the build,\n            training, and testing — you just review and approve before anything goes live.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details class=\"faq-item\">\n        <summary>\n          <span class=\"faq-num\">05<\u002Fspan>\n          <span class=\"faq-q\">Do I need any technical knowledge to set this up?<\u002Fspan>\n          <span class=\"faq-toggle\" aria-hidden=\"true\"><\u002Fspan>\n        <\u002Fsummary>\n        <div class=\"faq-a\">\n          <p>None. We configure everything on our end based on a simple onboarding form and\n            your intro call. You don't touch any code.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details class=\"faq-item\">\n        <summary>\n          <span class=\"faq-num\">06<\u002Fspan>\n          <span class=\"faq-q\">What happens when a call is too complex for the AI?<\u002Fspan>\n          <span class=\"faq-toggle\" aria-hidden=\"true\"><\u002Fspan>\n        <\u002Fsummary>\n        <div class=\"faq-a\">\n          <p>You set the rules before we go live — urgent calls, VIP clients, billing issues,\n            after-hours situations. When something falls outside what the AI handles, it\n            warm-transfers with context, takes a message, or schedules a callback. Nothing\n            gets dropped.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details class=\"faq-item\">\n        <summary>\n          <span class=\"faq-num\">07<\u002Fspan>\n          <span class=\"faq-q\">What if my business has seasonal call spikes?<\u002Fspan>\n          <span class=\"faq-toggle\" aria-hidden=\"true\"><\u002Fspan>\n        <\u002Fsummary>\n        <div class=\"faq-a\">\n          <p>The AI scales automatically. Whether you get 10 calls a day or 200, it handles\n            the volume without you adding staff or paying for idle hours.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details class=\"faq-item\">\n        <summary>\n          <span class=\"faq-num\">08<\u002Fspan>\n          <span class=\"faq-q\">Who owns my call data?<\u002Fspan>\n          <span class=\"faq-toggle\" aria-hidden=\"true\"><\u002Fspan>\n        <\u002Fsummary>\n        <div class=\"faq-a\">\n          <p>You do. Transcripts and call logs stay in your systems. We don't sell or share\n            your data. For medical and dental practices, we offer HIPAA-compliant workflows —\n            just bring it up on your intro call.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details class=\"faq-item\">\n        <summary>\n          <span class=\"faq-num\">09<\u002Fspan>\n          <span class=\"faq-q\">What happens when I call the demo number?<\u002Fspan>\n          <span class=\"faq-toggle\" aria-hidden=\"true\"><\u002Fspan>\n        <\u002Fsummary>\n        <div class=\"faq-a\">\n          <p>You'll reach a live AI receptionist — the same experience your customers would\n            get. Ask it about hours, services, or booking. It takes about two minutes and\n            requires no signup. The number is right on our site.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== CLOSING CTA ============== -->\n<section class=\"cta-final\" id=\"book\" data-screen-label=\"08 Closing CTA\">\n  <div class=\"container\">\n    <span class=\"ready-pill\" style=\"white-space: nowrap\">\n      <span class=\"ready-dot\" aria-hidden=\"true\"><\u002Fspan>\n      Ready when you are\n    <\u002Fspan>\n    <h2 style=\"margin-top: 32px; font-size: 100px; font-weight: 400\">Let <span style=\"color: rgb(36, 102, 233)\">on24seven<\u002Fspan> handle&nbsp;every call.<\u002Fh2>\n    <p class=\"lede\" style=\"margin: 0 auto 36px; text-align: center;\">\n      Join hundreds of businesses that never miss a customer call.<br>\n      Setup takes days, not weeks.\n    <\u002Fp>\n    <div class=\"cta-row\">\n      <a href=\"https://cal.com/mike-opalski/30min?overlayCalendar=true\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-primary\" style=\"background-color: rgb(36, 102, 233); border-color: rgb(200, 200, 204); border-width: 0px\">\n        <i data-lucide=\"calendar\" stroke-width=\"2\" aria-hidden=\"true\"><\u002Fi>\n        Book a discovery call\n        <span class=\"arr\">→<\u002Fspan>\n      <\u002Fa>\n      <a href=\"tel:+19045959958\" class=\"btn\" style=\"border-width: 0px\">\n        <i data-lucide=\"phone\" stroke-width=\"2\" aria-hidden=\"true\"><\u002Fi>\n        Try it out\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== FOOTER ============== -->\n<footer class=\"footer\">\n  <div class=\"container\">\n    <div class=\"footer-grid\">\n      <div>\n        <a href=\"#\" class=\"brand\" aria-label=\"on24seven.ai\"><img src=\"045a4cc8-571b-427b-851e-af29303b3fa3\" alt=\"on24seven.ai\" class=\"brand-logo\" width=\"1191\" height=\"260\"><\u002Fa>\n        <p class=\"blurb\" style=\"margin: 16px 0 0\">A receptionist that <span class=\"italic\">works&nbsp;24/7<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h6>Product<\u002Fh6>\n        <ul>\n          <li><\u002Fli>\n          <li><a href=\"#capabilities\">Capabilities<\u002Fa><\u002Fli>\n          <li><a href=\"#industries\">Industries<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div>\n        <h6>Company<\u002Fh6>\n        <ul>\n          <li><a href=\"#\">About<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Careers<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Press kit<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Contact<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div>\n        <h6>Get started<\u002Fh6>\n        <ul>\n          <li><a href=\"https://cal.com/mike-opalski/30min?overlayCalendar=true\" target=\"_blank\" rel=\"noopener\" class=\"footer-link-icon\"><i data-lucide=\"calendar\" stroke-width=\"2\" aria-hidden=\"true\"><\u002Fi>Book a discovery call<\u002Fa><\u002Fli>\n          <li><a href=\"tel:+19045959958\" class=\"footer-link-icon\"><i data-lucide=\"phone\" stroke-width=\"2\" aria-hidden=\"true\"><\u002Fi>Call (904)-595-9958<\u002Fa><\u002Fli>\n          <li><a href=\"mailto:hello@on24seven.ai\" class=\"footer-link-icon\"><i data-lucide=\"mail\" stroke-width=\"2\" aria-hidden=\"true\"><\u002Fi>hello@on24seven.ai<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer-bottom\">\n      <span>© 2026 ON24SEVENAI LLC<\u002Fspan>\n      <span>Made in St Johns, Florida · Answered everywhere<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n/* =====================================================================\n * on24seven.ai — ROI calculator interactions\n * ===================================================================== */\n\nconst inputs = {\n  miss:   document.getElementById(\"roiMiss\"),\n  ticket: document.getElementById(\"roiTicket\")\n};\nconst out = {\n  bigNum: document.getElementById(\"roiBig\"),\n  miss:   document.getElementById(\"roiMissVal\"),\n  ticket: document.getElementById(\"roiTicketVal\"),\n  monthCalls: document.getElementById(\"roiMonthCalls\"),\n  monthMiss:  document.getElementById(\"roiMonthMiss\"),\n  bookings:   document.getElementById(\"roiBookings\"),\n  rev:        document.getElementById(\"roiRev\")\n};\n\nconst fmt = (n) => Math.round(n).toLocaleString(\"en-US\");\nconst usd = (n) => \"$\" + fmt(n);\n\n// Constants\nconst DAYS = 20;  // working days Mon-Fri\n\nfunction updateRoi() {\n  // Update slider visuals (gradient fill behind the thumb)\n  for (const k in inputs) {\n    const el = inputs[k];\n    if (!el) continue;\n    const min = +el.min, max = +el.max, val = +el.value;\n    const p = ((val - min) / (max - min)) * 100;\n    el.style.setProperty(\"--p\", `${p}%`);\n  }\n\n  const missedPerDay = +inputs.miss.value;\n  const ticket       = +inputs.ticket.value;\n\n  const monthMissed = missedPerDay * DAYS;\n  const revenue     = monthMissed * ticket;\n\n  // Labels\n  out.miss.textContent   = missedPerDay;\n  out.ticket.textContent = fmt(ticket);\n\n  // Results\n  out.bigNum.textContent     = fmt(revenue);\n  out.monthCalls.textContent = fmt(monthMissed);\n  out.monthMiss.textContent  = fmt(monthMissed);\n  out.bookings.textContent   = fmt(monthMissed);\n  out.rev.textContent        = \"+\" + usd(revenue);\n\n  const yearly = document.getElementById('roiYearly');\n  if (yearly) yearly.textContent = '$' + fmt(revenue * 12) + ' / year recoverable';\n}\n\n// Only wire up if the ROI section exists\nif (inputs.miss && inputs.ticket) {\n  for (const k in inputs) inputs[k].addEventListener(\"input\", updateRoi);\n  updateRoi();\n}\n\n/* =====================================================================\n * Industries marquee — start centered on \"Law firms • Real estate\"\n * ===================================================================== */\n(function () {\n  const track = document.querySelector(\".strip-track\");\n  if (!track) return;\n\n  function centerPair() {\n    const spans = track.children;\n    const n = spans.length;\n    if (n < 4) return;\n    // The list is duplicated for the seamless loop; target the SECOND copy\n    // so there is a full set of items filling the space to its left.\n    const half = Math.floor(n / 2);\n    const law = spans[half];          // \"Law firms\"\n    const realEstate = spans[half + 1]; // \"Real estate agencies\"\n    if (!law || !realEstate) return;\n    // offsetLeft is a layout metric and ignores the marquee transform.\n    const pairStart = law.offsetLeft;\n    const pairEnd = realEstate.offsetLeft + realEstate.offsetWidth;\n    const pairCenter = (pairStart + pairEnd) / 2;\n    const start = window.innerWidth / 2 - pairCenter;\n    track.style.setProperty(\"--marquee-start\", start + \"px\");\n  }\n\n  centerPair();\n  // Recompute once webfonts settle (glyph widths shift the measurement).\n  if (document.fonts && document.fonts.ready) document.fonts.ready.then(centerPair);\n  window.addEventListener(\"load\", centerPair);\n  window.addEventListener(\"resize\", centerPair);\n})();\n\n/* =====================================================================\n * Smooth-ease scroll for in-page anchor links\n * ===================================================================== */\n(function () {\n  const HEADER_OFFSET = 80;\n  const DURATION = 900; // ms — slow, deliberate ease\n  const prefersReduced = window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n\n  // easeInOutCubic — smooth acceleration & deceleration\n  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);\n\n  function smoothScrollTo(targetY) {\n    const startY = window.pageYOffset;\n    const diff = targetY - startY;\n    if (Math.abs(diff) < 2) return;\n    const startTime = performance.now();\n    function step(now) {\n      const elapsed = now - startTime;\n      const t = Math.min(1, elapsed / DURATION);\n      window.scrollTo(0, startY + diff * ease(t));\n      if (t < 1) requestAnimationFrame(step);\n    }\n    requestAnimationFrame(step);\n  }\n\n  document.addEventListener(\"click\", (e) => {\n    const a = e.target.closest('a[href^=\"#\"]');\n    if (!a) return;\n    const href = a.getAttribute(\"href\");\n    if (!href || href === \"#\" || href.length < 2) return;\n    const target = document.querySelector(href);\n    if (!target) return;\n    e.preventDefault();\n    const top = target.getBoundingClientRect().top + window.pageYOffset - HEADER_OFFSET;\n    if (prefersReduced) {\n      window.scrollTo(0, top);\n    } else {\n      smoothScrollTo(top);\n    }\n    history.pushState(null, \"\", href);\n  });\n})();\n\n<\u002Fscript>\n\n<!-- Lucide icons -->\n<script src=\"c824ead6-a97c-4c86-8c0c-54d7c7304e51\"><\u002Fscript>\n<script>lucide.createIcons();<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
